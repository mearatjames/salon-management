# Tang Nails — apply pending Supabase migrations to the PRODUCTION project.
#
# Triggered on push to main (i.e. merge of a PR) that touches
# `supabase/migrations/**`. Also exposes `workflow_dispatch` for manual
# one-offs (e.g. re-running after a transient failure).
#
# Why this exists: see Constitution v1.0.3 § Development Workflow & Quality
# Gates — "Schema drift forbidden." The production project schema MUST match
# the migration set on `main`. Without this workflow, merging a PR that adds
# a migration leaves the production DB stale until someone runs `supabase
# db push` by hand.
#
# Security note: this workflow only uses repo-controlled `secrets.*` /
# `vars.*` and passes them via `env:` blocks (never inlines them into `run:`
# commands). No `github.event.*` or `github.head_ref` inputs are consumed.

name: db-migrate-prod

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# Strictly serial — never cancel an in-flight prod migration.
concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROD_PROJECT_REF }}
    steps:
      - name: Guard — required config present
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::vars.SUPABASE_PROD_PROJECT_REF is not set. Add it under Repo Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::secrets.SUPABASE_ACCESS_TOKEN and secrets.SUPABASE_PROD_DB_PASSWORD must both be set."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending migrations
        run: supabase db push --linked --include-all
