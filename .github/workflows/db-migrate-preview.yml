# Tang Nails — apply pending Supabase migrations to the PREVIEW project.
#
# Triggered on any PR (against main) that touches `supabase/migrations/**`.
# Applies new migrations to the preview Supabase project so the Vercel
# preview deploy of that PR has the matching schema.
#
# Why this exists: see Constitution v1.0.3 § Development Workflow & Quality
# Gates — "Schema drift forbidden." The preview project schema MUST match the
# migration set on the open PR; otherwise the preview deploy crashes on the
# first new query.
#
# Trade-off: the preview project is shared across PRs and migrations are
# forward-only — closed-without-merging PRs leave their migrations behind.
# For a single-developer flow this is fine; if it ever bites, recreate the
# preview project from scratch (~5 min on free tier).
#
# Security note: this workflow only uses repo-controlled `secrets.*` /
# `vars.*` and passes them via `env:` blocks (never inlines them into `run:`
# commands). No `github.event.*` or `github.head_ref` inputs are consumed.

name: db-migrate-preview

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Serialize so two PR pushes can't race the same DB. We do NOT
# cancel-in-progress: a half-applied migration is worse than waiting.
concurrency:
  group: db-migrate-preview
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PREVIEW_PROJECT_REF }}
    steps:
      - name: Guard — required config present
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::vars.SUPABASE_PREVIEW_PROJECT_REF is not set. Add it under Repo Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::secrets.SUPABASE_ACCESS_TOKEN and secrets.SUPABASE_PREVIEW_DB_PASSWORD must both be set."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # See ci.yml for rationale — pinned to avoid GitHub API rate limits.
          version: 2.98.2

      - name: Link to preview project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending migrations
        run: supabase db push --linked --include-all
