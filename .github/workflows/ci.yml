# Tang Nails CI — quality gates.
#
# Runs on every PR and on direct pushes to main. PR pushes auto-cancel any
# in-flight run for the same ref so iterative pushes don't burn CI minutes.
#
# The job boots a real Supabase stack (Postgres + GoTrue + PostgREST +
# Realtime + Storage + Mailpit) via the official supabase/setup-cli action,
# applies migrations + seed, then runs Playwright against it. The Supabase
# Docker images are cached between runs to keep cold-start manageable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # --- Supabase boot for e2e ----------------------------------------------
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Cache Supabase Docker images
        id: supabase-image-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/supabase-images.tar
          key: supabase-images-v1-${{ hashFiles('supabase/config.toml') }}
          restore-keys: |
            supabase-images-v1-

      - name: Load cached Supabase images
        if: steps.supabase-image-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/.cache/supabase-images.tar

      - name: Start Supabase + apply migration + seed
        run: |
          supabase start
          supabase db reset

      - name: Save Supabase images on cache miss
        if: steps.supabase-image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache
          images=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "public.ecr.aws/supabase/" | tr '\n' ' ')
          docker save $images -o ~/.cache/supabase-images.tar

      - name: Export Supabase env for tests
        run: |
          STATUS=$(supabase status -o env)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')"
            echo "ACTING_AS_COOKIE_SECRET=$(openssl rand -base64 32)"
            echo "NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED=false"
            echo "SALON_TZ=America/Los_Angeles"
            echo "SQUARE_APPLICATION_ID=placeholder"
            echo "SQUARE_APPLICATION_SECRET=placeholder"
            echo "SQUARE_ENVIRONMENT=sandbox"
            echo "SQUARE_WEBHOOK_SIGNATURE_KEY=placeholder"
          } >> $GITHUB_ENV

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
