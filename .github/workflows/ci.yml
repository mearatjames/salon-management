# Tang Nails CI — quality gates.
#
# Runs on every PR and on direct pushes to main. PR pushes auto-cancel any
# in-flight run for the same ref so iterative pushes don't burn CI minutes.
#
# Structure (see issue #32):
#   static  ┐
#   unit    ├─►  quality-gates (umbrella, required check)
#   build ──┴── e2e (matrix: shard 1..4)
#
# `static`, `unit`, and `build` run in parallel. `e2e` waits on `build` so
# it can download the prebuilt `.next/` artifact and skip recompiling.
# Each e2e shard boots its own Supabase stack (parallel boots don't
# compound — they all start at the same time on separate runners).
#
# Note: Supabase Docker image caching was tried previously but blew past the
# runner's 14 GB disk limit with the full Supabase service set. Issue #34
# now trims the image set via `--exclude` so the cold pull is leaner; image
# caching is still skipped because trimming alone hits the boot-time budget
# and tarballing GBs of images has its own per-run overhead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails fast on PRs that don't contain the latest `origin/main`. Gates
  # the rest of the matrix via `needs:`, so stale PRs don't burn CI
  # minutes on a snapshot that won't merge cleanly. Push-to-main runs
  # skip this job entirely (no `if:` match), so downstream jobs use
  # `result == 'skipped'` to keep firing.
  branch-freshness:
    name: Branch freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # `actions/checkout` defaults to the GitHub-generated merge commit
      # (PR head merged with base), which already contains `origin/main`
      # and would make the ancestor test a no-op. Pin to the PR head SHA
      # so the check reflects the actual branch state.
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify PR head contains origin/main
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch is up to date with origin/main."
            exit 0
          fi
          behind=$(git rev-list --count HEAD..origin/main)
          echo "::error::This PR is behind origin/main by $behind commit(s). Rebase or merge main into the branch, then push again."
          exit 1

  static:
    name: Static checks (lint + format + types)
    runs-on: ubuntu-latest
    needs: branch-freshness
    # Run when freshness passed (PRs) or was skipped (push to main).
    if: ${{ !cancelled() && needs.branch-freshness.result != 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: branch-freshness
    if: ${{ !cancelled() && needs.branch-freshness.result != 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: branch-freshness
    if: ${{ !cancelled() && needs.branch-freshness.result != 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Hand off the prebuilt Next.js output to the e2e shards so each
      # one doesn't re-run `npm run build`. .next/cache is excluded —
      # it's only useful for incremental rebuilds, not `npm run start`.
      - name: Upload .next build output
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          retention-days: 1
          if-no-files-found: error
          # .next is a dotfile dir — actions/upload-artifact@v7 excludes
          # hidden paths by default, which silently drops everything.
          include-hidden-files: true

  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: [branch-freshness, build]
    # Without an explicit `if:`, the implicit success() check returns false
    # when any transitive ancestor was skipped — and `branch-freshness` is
    # skipped on push-to-main. Mirror the override used by static/unit/build
    # so push-to-main runs actually execute the matrix. (Issue #74.)
    if: ${{ !cancelled() && needs.branch-freshness.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download .next build output
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      # --- Supabase boot for e2e ----------------------------------------------
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Pinned: `version: latest` hits the GitHub Releases API
          # unauthenticated (60 req/hr per runner IP). With 4 e2e shards +
          # migrate workflows firing on every PR, the quota is fragile and
          # causes flaky "rate limit exceeded" failures. Bump deliberately.
          version: 2.98.2

      - name: Start Supabase + apply migration + seed
        # Issue #34: skip Supabase services Tang Nails doesn't use to shrink
        # the cold-pull bill. Local dev keeps the full stack — this is CI-only.
        #
        #   studio + postgres-meta — dashboard UI; never opened by tests
        #   edge-runtime           — no supabase/functions/ directory
        #   imgproxy + storage-api — no Supabase Storage usage in app or tests
        #   realtime               — no supabase.channel / realtime subscriptions
        #   vector + logflare      — log shipping; tests don't read them
        #
        # mailpit/inbucket STAYS — auth.spec.ts and onboarding.spec.ts read
        # magic-link emails from it at 127.0.0.1:54324.
        run: |
          supabase start --exclude studio,postgres-meta,edge-runtime,imgproxy,storage-api,realtime,vector,logflare
          supabase db reset

      - name: Export Supabase env for tests
        run: |
          STATUS=$(supabase status -o env)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')"
            echo "ACTING_AS_COOKIE_SECRET=$(openssl rand -base64 32)"
            echo "NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED=false"
            echo "SALON_TZ=America/Los_Angeles"
            echo "SQUARE_APPLICATION_ID=placeholder"
            echo "SQUARE_APPLICATION_SECRET=placeholder"
            echo "SQUARE_ENVIRONMENT=sandbox"
            # Match the deterministic test key the e2e stub uses when
            # signing webhook POSTs (tests/e2e/_square-stub.ts reads it
            # from tests/fixtures/square-webhook-key.txt). Same value, no
            # secrets — the fixture lives in the repo.
            echo "SQUARE_WEBHOOK_SIGNATURE_KEY=$(cat tests/fixtures/square-webhook-key.txt)"
            # Route server-side Square fetches at the local Playwright stub
            # (_square-server-stub.ts, port 4567) so e2e never hits Square's
            # real sandbox host.
            echo "SQUARE_API_BASE_URL=http://127.0.0.1:4567"
            # Vault secret name used by lib/square/oauth.ts when encrypting
            # tokens at rest; matches the e2e setup that seeds vault.secrets.
            echo "SQUARE_OAUTH_KEY_VAULT_NAME=square_oauth_key"
            # Cron auth shared with /api/square/refresh-token tests.
            echo "CRON_SECRET=ci-placeholder-cron-secret"
          } >> $GITHUB_ENV

      # Cache the Playwright browser install keyed on the resolved
      # @playwright/test version pinned in package-lock.json. On a hit,
      # we skip `--with-deps` (system libs are already provisioned on
      # ubuntu-latest images) and just run `playwright install` to ensure
      # the binary symlinks are in place — fast no-op when files exist.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers (cached — verify install)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: End-to-end tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    needs: [branch-freshness, static, unit, build, e2e]
    if: always()
    steps:
      # Umbrella check: succeeds only when every required job succeeded.
      # Point branch-protection's required-check rule at this job name so
      # the matrix shard fan-out doesn't have to be enumerated there.
      - name: Verify all required jobs succeeded
        run: |
          # Surface branch-freshness first — when it fails, every downstream
          # job is marked "skipped" and the generic loop would print a
          # confusing chain of "did not succeed" errors. Calling it out
          # explicitly keeps the failure message actionable.
          if [[ "${{ needs.branch-freshness.result }}" == "failure" ]]; then
            echo "::error::PR is behind origin/main — rebase or merge main into the branch, then push again."
            exit 1
          fi
          results=(
            "static:${{ needs.static.result }}"
            "unit:${{ needs.unit.result }}"
            "build:${{ needs.build.result }}"
            "e2e:${{ needs.e2e.result }}"
          )
          fail=0
          for entry in "${results[@]}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [[ "$result" != "success" ]]; then
              echo "::error::Required job '$name' did not succeed (result: $result)"
              fail=1
            else
              echo "Required job '$name' succeeded"
            fi
          done
          exit $fail
