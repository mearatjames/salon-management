<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Tang Nails Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    /* ── Lacquer tokens ──────────────────────────────────────────── */
    :root {
      --neutral-0:   oklch(1 0 0);
      --neutral-50:  oklch(0.99 0.003 90);
      --neutral-100: oklch(0.97 0.004 90);
      --neutral-200: oklch(0.93 0.005 90);
      --neutral-300: oklch(0.87 0.006 90);
      --neutral-400: oklch(0.71 0.008 90);
      --neutral-500: oklch(0.55 0.01 90);
      --neutral-900: oklch(0.16 0.012 90);
      --neutral-950: oklch(0.10 0.012 90);

      --rose-50:  oklch(0.97 0.012 12);
      --rose-100: oklch(0.93 0.025 12);
      --rose-200: oklch(0.86 0.045 12);
      --rose-300: oklch(0.76 0.07 12);
      --rose-400: oklch(0.64 0.10 12);
      --rose-500: oklch(0.55 0.12 12);
      --rose-600: oklch(0.48 0.12 12);

      --background:          var(--neutral-50);
      --foreground:          var(--neutral-900);
      --card:                var(--neutral-0);
      --card-foreground:     var(--neutral-900);
      --primary:             var(--rose-500);
      --primary-foreground:  var(--neutral-0);
      --muted:               var(--neutral-100);
      --muted-foreground:    var(--neutral-400);
      --accent:              var(--neutral-100);
      --border:              var(--neutral-200);
      --input:               var(--neutral-200);
      --ring:                var(--rose-400);
      --destructive:         oklch(0.58 0.18 25);

      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;

      --shadow-md: 0 8px 24px -4px rgb(0 0 0 / 0.10), 0 2px 6px -2px rgb(0 0 0 / 0.06);

      --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
      --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
      --space-12:48px; --space-16:64px;

      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --text-xs:12px; --text-sm:13px; --text-base:14px; --text-md:15px;
      --text-lg:16px; --text-xl:18px; --text-2xl:20px; --text-3xl:24px; --text-4xl:30px;
      --leading-tight:1.1; --leading-snug:1.25; --leading-normal:1.5;
      --tracking-tight:-0.02em; --tracking-snug:-0.01em; --tracking-wide:0.04em;
      --ease-out: cubic-bezier(0.16,1,0.3,1);
      --duration-fast:150ms; --duration-base:200ms;
    }

    .dark {
      --background:         oklch(0.10 0.012 90);
      --foreground:         oklch(0.99 0.003 90);
      --card:               oklch(0.16 0.012 90);
      --card-foreground:    oklch(0.99 0.003 90);
      --primary:            var(--rose-400);
      --primary-foreground: oklch(0.10 0.012 90);
      --muted:              oklch(0.24 0.012 90);
      --muted-foreground:   oklch(0.71 0.008 90);
      --accent:             oklch(0.24 0.012 90);
      --border:             oklch(0.28 0.012 90);
      --input:              oklch(0.28 0.012 90);
      --ring:               var(--rose-500);
      --panel-bg:           oklch(0.13 0.010 12);
      --panel-border:       oklch(0.22 0.015 12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      color: var(--foreground);
      background: var(--background);
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv02","cv03","cv04","cv11";
    }

    /* ── Shell ── */
    .shell {
      display: grid;
      grid-template-columns: 1fr 480px;
      min-height: 100dvh;
    }
    .shell.centered {
      grid-template-columns: 1fr;
    }

    /* ── Brand panel ── */
    .brand-panel {
      background: var(--panel-bg, var(--rose-50));
      border-right: 1px solid var(--panel-border, var(--rose-100));
      display: flex;
      flex-direction: column;
      padding: var(--space-10) var(--space-12);
      position: relative;
      overflow: hidden;
    }
    .brand-deco {
      position: absolute;
      width: 380px; height: 380px;
      top: -90px; right: -70px;
      opacity: 0.075;
      pointer-events: none;
    }
    .dark .brand-deco { opacity: 0.05; }
    .brand-deco-2 {
      position: absolute;
      width: 160px; height: 160px;
      bottom: 48px; right: 40px;
      opacity: 0.045;
      pointer-events: none;
      transform: rotate(18deg);
    }
    .dark .brand-deco-2 { opacity: 0.03; }

    .brand-wordmark {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      position: relative;
      z-index: 1;
    }
    .brand-name {
      font-size: var(--text-md);
      font-weight: 600;
      letter-spacing: var(--tracking-snug);
    }
    .brand-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: var(--space-16);
      position: relative;
      z-index: 1;
    }
    .brand-tagline {
      font-size: var(--text-4xl);
      font-weight: 600;
      line-height: var(--leading-tight);
      letter-spacing: var(--tracking-tight);
      max-width: 380px;
    }
    .brand-sub {
      margin-top: var(--space-4);
      font-size: var(--text-md);
      color: var(--muted-foreground);
      line-height: var(--leading-normal);
      max-width: 340px;
    }

    /* ── Form panel ── */
    .form-panel {
      background: var(--card);
      border-left: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-12) var(--space-10);
      min-height: 100dvh;
    }
    .shell.centered .form-panel {
      border-left: none;
    }
    .form-well {
      width: 100%;
      max-width: 360px;
    }

    /* ── View transitions ── */
    .view-pane {
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
      animation: viewIn var(--duration-base) var(--ease-out);
    }
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Form pieces ── */
    .form-header { display: flex; flex-direction: column; gap: var(--space-2); }
    .form-title {
      font-size: var(--text-3xl);
      font-weight: 600;
      letter-spacing: var(--tracking-snug);
      line-height: var(--leading-snug);
    }
    .form-subtitle { font-size: var(--text-sm); color: var(--muted-foreground); }

    .form-body { display: flex; flex-direction: column; gap: var(--space-5); }

    .field { display: flex; flex-direction: column; gap: var(--space-2); }
    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    label { font-size: var(--text-sm); font-weight: 500; }

    .text-input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--input);
      border-radius: var(--radius-xs);
      background: var(--background);
      font-size: var(--text-base);
      font-family: var(--font-sans);
      color: var(--foreground);
      outline: none;
      transition:
        border-color var(--duration-fast) var(--ease-out),
        box-shadow var(--duration-fast) var(--ease-out);
    }
    .text-input::placeholder { color: var(--muted-foreground); }
    .text-input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 18%, transparent);
    }
    .text-input.suffixed { padding-right: 40px; }

    .input-wrap { position: relative; }
    .suffix-btn {
      position: absolute; right: 0; top: 0;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      color: var(--muted-foreground);
      transition: color var(--duration-fast) var(--ease-out);
    }
    .suffix-btn:hover { color: var(--foreground); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: var(--space-2);
      height: 40px; padding: 0 var(--space-4);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: var(--text-base); font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer; white-space: nowrap; width: 100%;
      transition: background var(--duration-fast) var(--ease-out),
                  border-color var(--duration-fast) var(--ease-out);
    }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .btn-primary:hover { background: color-mix(in oklch, var(--primary) 88%, black); }
    .btn-outline {
      background: transparent;
      color: var(--foreground);
      border-color: var(--border);
    }
    .btn-outline:hover { background: var(--accent); }

    .divider {
      display: flex; align-items: center; gap: var(--space-3);
      color: var(--muted-foreground);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content:""; flex:1; height:1px; background: var(--border);
    }

    .link-btn {
      background: none; border: none; cursor: pointer;
      font-family: var(--font-sans);
      color: var(--muted-foreground);
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color var(--duration-fast) var(--ease-out);
      padding: 0; line-height: inherit;
    }
    .link-btn:hover { color: var(--foreground); }
    .link-btn.xs { font-size: var(--text-xs); }
    .link-btn.sm { font-size: var(--text-sm); }

    .back-btn {
      display: inline-flex; align-items: center; gap: var(--space-2);
      background: none; border: none; cursor: pointer;
      font-family: var(--font-sans); font-size: var(--text-sm);
      color: var(--muted-foreground); padding: 0; margin-bottom: var(--space-6);
      transition: color var(--duration-fast) var(--ease-out);
    }
    .back-btn:hover { color: var(--foreground); }

    .alert {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--text-sm); line-height: var(--leading-normal);
    }
    .alert-error {
      background: color-mix(in oklch, var(--destructive) 8%, transparent);
      color: var(--destructive);
      border: 1px solid color-mix(in oklch, var(--destructive) 22%, transparent);
    }

    .confirm-card {
      padding: var(--space-5);
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex; flex-direction: column; gap: var(--space-3);
    }
    .confirm-card p { font-size: var(--text-sm); line-height: var(--leading-normal); }
    .confirm-card strong { font-weight: 500; color: var(--foreground); }

    /* Solo wordmark (when panel hidden) */
    .solo-mark {
      display: flex; align-items: center; gap: var(--space-2);
      margin-bottom: var(--space-10);
    }
    .solo-mark-name {
      font-size: var(--text-md); font-weight: 600;
      letter-spacing: var(--tracking-snug);
    }

    @media (max-width: 720px) {
      .shell { grid-template-columns: 1fr !important; }
      .brand-panel { display: none !important; }
      .form-panel { border-left: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">

const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "darkMode": false,
  "showError": false,
  "showPanel": true
}/*EDITMODE-END*/;

/* ── Icons ─────────────────────────────────────────────────────────────── */

function LacquerMark({ size = 24 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none">
      <path d="M32 4c-9 0-16 7-16 18 0 8 3 14 6 22 2 6 4 12 4 16 0 0 2 0 6 0s6 0 6 0c0-4 2-10 4-16 3-8 6-14 6-22 0-11-7-18-16-18z" fill="oklch(0.55 0.12 12)"/>
      <path d="M32 4c-9 0-16 7-16 18 0 4 1 8 2 11 4-3 9-5 14-5s10 2 14 5c1-3 2-7 2-11 0-11-7-18-16-18z" fill="oklch(0.76 0.07 12)"/>
    </svg>
  );
}

const EyeIcon = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>
);
const EyeOffIcon = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
    <line x1="2" x2="22" y1="2" y2="22"/>
  </svg>
);
const ChevronLeft = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <path d="m15 18-6-6 6-6"/>
  </svg>
);
const AlertCircle = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  </svg>
);
const GoogleIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" style={{flexShrink:0}}>
    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
  </svg>
);

/* ── Views ──────────────────────────────────────────────────────────────── */

function SignInView({ showError, onForgot, onMagic }) {
  const [showPw, setShowPw] = useState(false);
  return (
    <div className="view-pane" key="signin">
      <div className="form-header">
        <h1 className="form-title">Sign in</h1>
        <p className="form-subtitle">Welcome back to Tang Nails Studio</p>
      </div>

      {showError && (
        <div className="alert alert-error">
          <AlertCircle />
          Email or password is incorrect.
        </div>
      )}

      <div className="form-body">
        <div className="field">
          <label htmlFor="signin-email">Email</label>
          <input
            id="signin-email" type="email" autoComplete="username"
            placeholder="you@tangstudio.com"
            className="text-input"
          />
        </div>

        <div className="field">
          <div className="field-row">
            <label htmlFor="signin-pw">Password</label>
            <button type="button" className="link-btn xs" onClick={onForgot}>
              Forgot password?
            </button>
          </div>
          <div className="input-wrap">
            <input
              id="signin-pw"
              type={showPw ? "text" : "password"}
              autoComplete="current-password"
              className="text-input suffixed"
            />
            <button
              type="button" className="suffix-btn"
              aria-label={showPw ? "Hide password" : "Show password"}
              onClick={() => setShowPw(v => !v)}
            >
              {showPw ? <EyeOffIcon /> : <EyeIcon />}
            </button>
          </div>
        </div>

        <button type="button" className="btn btn-primary">Sign in</button>
      </div>

      <div className="divider">or</div>

      <div style={{display:"flex", flexDirection:"column", gap:"var(--space-3)"}}>
        <button type="button" className="btn btn-outline" style={{gap:"var(--space-3)"}}>
          <GoogleIcon />
          Continue with Google
        </button>

        <div style={{textAlign:"center", paddingTop:"var(--space-1)"}}>
          <button type="button" className="link-btn sm" onClick={onMagic}>
            Email me a sign-in link instead
          </button>
        </div>
      </div>
    </div>
  );
}

function ForgotView({ onBack, onSent }) {
  const [email, setEmail] = useState('');
  return (
    <div className="view-pane" key="forgot">
      <div>
        <button type="button" className="back-btn" onClick={onBack}>
          <ChevronLeft /> Back to sign in
        </button>
        <div className="form-header">
          <h1 className="form-title">Reset password</h1>
          <p className="form-subtitle">Enter your email and we'll send a reset link.</p>
        </div>
      </div>

      <div className="form-body">
        <div className="field">
          <label htmlFor="forgot-email">Email</label>
          <input
            id="forgot-email" type="email" autoComplete="email"
            placeholder="you@tangstudio.com"
            className="text-input"
            value={email}
            onChange={e => setEmail(e.target.value)}
          />
        </div>
        <button type="button" className="btn btn-primary" onClick={() => onSent(email)}>
          Send reset link
        </button>
      </div>
    </div>
  );
}

function ForgotSentView({ email, onBack, onResend }) {
  return (
    <div className="view-pane" key="forgot-sent">
      <div>
        <button type="button" className="back-btn" onClick={onBack}>
          <ChevronLeft /> Back to sign in
        </button>
        <div className="form-header">
          <h1 className="form-title">Check your email</h1>
          <p className="form-subtitle">A reset link is on its way.</p>
        </div>
      </div>

      <div className="confirm-card">
        <p>
          We sent a password reset link to{" "}
          <strong>{email || "your inbox"}</strong>.
          Click it to set a new password.
        </p>
        <p style={{color:"var(--muted-foreground)", fontSize:"var(--text-xs)"}}>
          Didn't get it? Check your spam folder, or{" "}
          <button type="button" className="link-btn xs" onClick={onResend}>
            send another link
          </button>.
        </p>
      </div>
    </div>
  );
}

function MagicView({ onBack, onSent }) {
  const [email, setEmail] = useState('');
  return (
    <div className="view-pane" key="magic">
      <div>
        <button type="button" className="back-btn" onClick={onBack}>
          <ChevronLeft /> Back to sign in
        </button>
        <div className="form-header">
          <h1 className="form-title">Sign in with a link</h1>
          <p className="form-subtitle">We'll email you a one-time sign-in link — no password needed.</p>
        </div>
      </div>

      <div className="form-body">
        <div className="field">
          <label htmlFor="magic-email">Email</label>
          <input
            id="magic-email" type="email" autoComplete="email"
            placeholder="you@tangstudio.com"
            className="text-input"
            value={email}
            onChange={e => setEmail(e.target.value)}
          />
        </div>
        <button type="button" className="btn btn-primary" onClick={() => onSent(email)}>
          Send link
        </button>
      </div>
    </div>
  );
}

function MagicSentView({ email, onBack, onResend }) {
  return (
    <div className="view-pane" key="magic-sent">
      <div>
        <button type="button" className="back-btn" onClick={onBack}>
          <ChevronLeft /> Back to sign in
        </button>
        <div className="form-header">
          <h1 className="form-title">Check your email</h1>
          <p className="form-subtitle">A sign-in link is on its way.</p>
        </div>
      </div>

      <div className="confirm-card">
        <p>
          We sent a sign-in link to{" "}
          <strong>{email || "your inbox"}</strong>.
          Click it from your inbox — you can close this tab.
        </p>
        <p style={{color:"var(--muted-foreground)", fontSize:"var(--text-xs)"}}>
          Didn't get it? Check your spam folder, or{" "}
          <button type="button" className="link-btn xs" onClick={onResend}>
            send another link
          </button>.
        </p>
      </div>
    </div>
  );
}

/* ── App ────────────────────────────────────────────────────────────────── */

function App() {
  const { tweaks = TWEAK_DEFAULTS, setTweak } = useTweaks(TWEAK_DEFAULTS);
  const [view, setView]           = useState('signin');
  const [resetEmail, setResetEmail] = useState('');
  const [magicEmail, setMagicEmail] = useState('');

  const isDark     = tweaks.darkMode;
  const showPanel  = tweaks.showPanel;
  const showError  = tweaks.showError;

  function renderView() {
    switch (view) {
      case 'signin':
        return <SignInView showError={showError} onForgot={() => setView('forgot')} onMagic={() => setView('magic')} />;
      case 'forgot':
        return <ForgotView onBack={() => setView('signin')} onSent={e => { setResetEmail(e); setView('forgot-sent'); }} />;
      case 'forgot-sent':
        return <ForgotSentView email={resetEmail} onBack={() => setView('signin')} onResend={() => setView('forgot')} />;
      case 'magic':
        return <MagicView onBack={() => setView('signin')} onSent={e => { setMagicEmail(e); setView('magic-sent'); }} />;
      case 'magic-sent':
        return <MagicSentView email={magicEmail} onBack={() => setView('signin')} onResend={() => setView('magic')} />;
      default: return null;
    }
  }

  return (
    <div className={isDark ? 'dark' : ''} style={{height:'100%'}}>
      <div className={`shell${showPanel ? '' : ' centered'}`}>

        {/* ── Brand panel ── */}
        {showPanel && (
          <div className="brand-panel">
            <svg className="brand-deco" viewBox="0 0 64 64" fill="none">
              <path d="M32 4c-9 0-16 7-16 18 0 8 3 14 6 22 2 6 4 12 4 16 0 0 2 0 6 0s6 0 6 0c0-4 2-10 4-16 3-8 6-14 6-22 0-11-7-18-16-18z" fill="oklch(0.55 0.12 12)"/>
              <path d="M32 4c-9 0-16 7-16 18 0 4 1 8 2 11 4-3 9-5 14-5s10 2 14 5c1-3 2-7 2-11 0-11-7-18-16-18z" fill="oklch(0.76 0.07 12)"/>
            </svg>
            <svg className="brand-deco-2" viewBox="0 0 64 64" fill="none">
              <path d="M32 4c-9 0-16 7-16 18 0 8 3 14 6 22 2 6 4 12 4 16 0 0 2 0 6 0s6 0 6 0c0-4 2-10 4-16 3-8 6-14 6-22 0-11-7-18-16-18z" fill="oklch(0.55 0.12 12)"/>
              <path d="M32 4c-9 0-16 7-16 18 0 4 1 8 2 11 4-3 9-5 14-5s10 2 14 5c1-3 2-7 2-11 0-11-7-18-16-18z" fill="oklch(0.76 0.07 12)"/>
            </svg>

            <div className="brand-wordmark">
              <LacquerMark size={26} />
              <span className="brand-name">Tang Nails Studio</span>
            </div>

            <div className="brand-content">
              <p className="brand-tagline">Studio tools built for focused work.</p>
              <p className="brand-sub">Bookings, clients, payments, and staff scheduling — all in one quiet place.</p>
            </div>
          </div>
        )}

        {/* ── Form panel ── */}
        <div className="form-panel">
          <div className="form-well">
            {!showPanel && (
              <div className="solo-mark">
                <LacquerMark size={24} />
                <span className="solo-mark-name">Tang Nails Studio</span>
              </div>
            )}
            {renderView()}
          </div>
        </div>

      </div>

      {/* ── Tweaks ── */}
      <TweaksPanel>
        <TweakSection label="Appearance">
          <TweakToggle label="Dark mode"         value={tweaks.darkMode}   onChange={v => setTweak('darkMode', v)} />
          <TweakToggle label="Show brand panel"  value={tweaks.showPanel}  onChange={v => setTweak('showPanel', v)} />
        </TweakSection>
        <TweakSection label="State">
          <TweakToggle label="Show error"        value={tweaks.showError}  onChange={v => setTweak('showError', v)} />
          <TweakSelect
            label="View"
            value={view}
            options={[
              {label:'Sign in',          value:'signin'},
              {label:'Forgot password',  value:'forgot'},
              {label:'Reset link sent',  value:'forgot-sent'},
              {label:'Magic link',       value:'magic'},
              {label:'Magic link sent',  value:'magic-sent'},
            ]}
            onChange={v => setView(v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
