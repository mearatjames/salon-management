<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:var(--font-sans);transition:all 150ms var(--ease-out)}
  .btn-primary{background:var(--primary);color:var(--primary-foreground)}
  .btn-secondary{background:var(--secondary);color:var(--secondary-foreground);border-color:var(--border)}
  .btn-outline{background:transparent;color:var(--foreground);border-color:var(--border)}
  .btn-ghost{background:transparent;color:var(--foreground)}
  .btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}
  .btn-link{background:transparent;color:var(--primary);text-decoration:underline;text-underline-offset:3px;padding:0;height:auto}
  .btn-sm{height:30px;padding:0 10px;font-size:12px}
  .btn-lg{height:42px;padding:0 18px;font-size:14px}
  .btn svg{width:14px;height:14px}
  .lbl{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);width:80px;text-transform:uppercase;letter-spacing:0.04em}
</style></head>
<body>
  <div class="row"><span class="lbl">variants</span>
    <button class="btn btn-primary">Add client</button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-outline">Reschedule</button>
    <button class="btn btn-ghost">Skip</button>
    <button class="btn btn-destructive">Delete</button>
    <button class="btn btn-link">View receipt</button>
  </div>
  <div class="row"><span class="lbl">sizes</span>
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
  </div>
  <div class="row"><span class="lbl">w/ icon</span>
    <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>New booking</button>
    <button class="btn btn-outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" stroke-linecap="round"/></svg>Search</button>
  </div>
</body></html>
