<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row .tag{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono)}
  .row .meta{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono)}
</style>
</head>
<body>
  <div class="row"><span class="tag">h1 / 5xl</span><span style="font-size:36px;font-weight:600;letter-spacing:-0.02em;line-height:1.1">Polish, perfected</span><span class="meta">36 / 600</span></div>
  <div class="row"><span class="tag">h2 / 3xl</span><span style="font-size:24px;font-weight:600;letter-spacing:-0.01em;line-height:1.1">Today's appointments</span><span class="meta">24 / 600</span></div>
  <div class="row"><span class="tag">h3 / xl</span><span style="font-size:18px;font-weight:600;line-height:1.25">Russian Manicure — 60 min</span><span class="meta">18 / 600</span></div>
</body></html>
