<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:18px 20px}
  .row{display:flex;gap:32px;align-items:flex-start}
  .menu{background:var(--popover);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);padding:4px;min-width:180px;font-size:13px}
  .menu-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer}
  .menu-item:hover,.menu-item.active{background:var(--accent)}
  .menu-item svg{width:14px;height:14px;color:var(--muted-foreground)}
  .menu-item .kbd{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
  .menu-sep{height:1px;background:var(--border);margin:4px 0}
  .menu-label{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted-foreground);padding:6px 8px 2px}
  .danger{color:var(--destructive)}
  .danger svg{color:var(--destructive)}

  .tip{background:var(--neutral-900);color:var(--neutral-50);font-size:12px;padding:6px 10px;border-radius:6px;box-shadow:var(--shadow-sm);position:relative;display:inline-block}
  .tip::after{content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;background:var(--neutral-900)}
</style></head>
<body>
  <div class="row">
    <div class="menu">
      <div class="menu-label">Appointment</div>
      <div class="menu-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>New booking<span class="kbd">⌘N</span></div>
      <div class="menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 109-9" stroke-linecap="round"/><path d="M3 4v5h5" stroke-linecap="round" stroke-linejoin="round"/></svg>Reschedule<span class="kbd">R</span></div>
      <div class="menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>Mark complete</div>
      <div class="menu-sep"></div>
      <div class="menu-item danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M6 6l1 14a2 2 0 002 2h6a2 2 0 002-2l1-14" stroke-linecap="round" stroke-linejoin="round"/></svg>Cancel booking</div>
    </div>

    <div style="padding-top:24px"><div class="tip">Maya last visited Apr 14</div></div>
  </div>
</body></html>
