<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:16px 20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow-xs)}
  .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
  .ttl{font-size:13px;font-weight:600}
  .sub{font-size:11px;color:var(--muted-foreground);margin-top:2px}
  .stat{font-size:24px;font-weight:600;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
  .delta{font-size:11px;color:oklch(0.42 0.13 150);margin-left:4px}
  .row{display:flex;align-items:center;gap:8px;font-size:12px}
  .row + .row{margin-top:6px}
  .av{width:24px;height:24px;border-radius:9999px;background:color-mix(in oklch,var(--primary) 15%,transparent);color:var(--rose-700);font-size:10px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
</style></head>
<body>
  <div class="grid">
    <div class="card">
      <div class="head"><div><div class="ttl">Today's revenue</div><div class="sub">Closes in 3h 12m</div></div></div>
      <div><span class="stat">$1,840</span><span class="delta">+12%</span></div>
    </div>
    <div class="card">
      <div class="head"><div><div class="ttl">Next appointment</div><div class="sub">In 18 minutes</div></div></div>
      <div class="row"><span class="av">MP</span><span style="font-weight:500">Maya Patel</span><span style="color:var(--muted-foreground)">· Gel polish · w/ Priya</span></div>
    </div>
  </div>
</body></html>
