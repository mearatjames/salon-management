<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="_card.css">
  <style>
    body { padding: 20px 24px; display: flex; flex-direction: column; gap: 22px; }

    /* ── Layout helpers ──────────────────────────────── */
    .row     { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .row-top { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .vr      { width: 1px; height: 30px; background: var(--border); flex-shrink: 0; }

    /* ── Section label ───────────────────────────────── */
    .lbl {
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      font-weight: 500;
      font-family: var(--font-mono);
      margin-bottom: 10px;
    }

    /* ── Size tags ───────────────────────────────────── */
    .sz {
      font-size: 10px;
      color: var(--muted-foreground);
      font-family: var(--font-mono);
    }

    /* ── Spinner ─────────────────────────────────────── */
    /*
      Lucide Loader2 arc — 1.2s linear (matches reconnecting-banner).
      Use at 16 / 20 / 24px to match Lucide's three icon sizes.
      stroke-width: 1.5 on default; bump to 1.8 on small sizes.
    */
    @keyframes lq-spin { to { transform: rotate(360deg); } }
    .spin {
      animation: lq-spin 1.2s linear infinite;
      display: block;
      flex-shrink: 0;
    }
    .spin-cell {
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
    }
    .spin-surface {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
    }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 14px;
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
      border: 1px solid transparent;
      cursor: not-allowed;
      font-family: var(--font-sans);
      opacity: 0.72;
    }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .btn-p { background: var(--primary); color: var(--primary-foreground); }
    .btn-s { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); }
    .btn-o { background: transparent; color: var(--foreground); border-color: var(--border); }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }
    .btn-sm svg { width: 12px; height: 12px; }

    /* ── Skeleton shimmer ────────────────────────────── */
    /*
      Horizontal gradient sweep — more premium than pulse.
      Base: --muted (neutral-100). Highlight: --neutral-300 for visible contrast.
      background-size wide enough to create a smooth cross-fade.
    */
    @keyframes lq-shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .sk {
      background: linear-gradient(
        90deg,
        var(--muted)       0%,
        var(--neutral-300) 45%,
        var(--muted)       80%
      );
      background-size: 1200px 100%;
      animation: lq-shimmer 1.6s ease-in-out infinite;
    }
    /* Shape modifiers */
    .sk-ln { height: 12px; border-radius: var(--radius-xs); }  /* body line  */
    .sk-sm { height:  9px; border-radius: var(--radius-xs); }  /* small / sub */
    .sk-lg { height: 18px; border-radius: var(--radius-xs); }  /* stat value  */
    .sk-cr { border-radius: var(--radius-full); flex-shrink: 0; } /* circle / avatar */
    .sk-sq { border-radius: var(--radius-md); flex-shrink: 0; }   /* square block */

    /* ── Skeleton card specimen ──────────────────────── */
    .sk-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      width: 190px;
      box-shadow: var(--shadow-xs);
      display: flex; flex-direction: column; gap: 8px;
    }

    /* ── Skeleton table specimen ─────────────────────── */
    .sk-table {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      width: 274px;
      box-shadow: var(--shadow-xs);
    }
    .sk-thead {
      background: var(--muted);
      padding: 7px 12px;
      display: flex; gap: 28px;
      border-bottom: 1px solid var(--border);
    }
    .sk-trow {
      padding: 9px 12px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .sk-trow:last-child { border-bottom: none; }

    /* ── Full-screen mock frames ─────────────────────── */
    .fs-mock {
      width: 200px; height: 120px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden; position: relative;
      background: var(--background);
    }
    .fs-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
    }
    .fs-label {
      font-size: 10px;
      color: var(--muted-foreground);
      font-family: var(--font-mono);
      text-align: center;
      margin-top: 5px;
    }

    /* ── Lacquer mark (inline) ───────────────────────── */
    .lq-mark { display: block; }
  </style>
</head>
<body>

  <!-- ── Spinner ─────────────────────────────────────── -->
  <div>
    <div class="lbl">Spinner — Lucide Loader2, 1.2s linear</div>
    <div class="row">

      <!-- sizes -->
      <div class="spin-cell">
        <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        <span class="sz">16</span>
      </div>
      <div class="spin-cell">
        <svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        <span class="sz">20</span>
      </div>
      <div class="spin-cell">
        <svg class="spin" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        <span class="sz">24</span>
      </div>

      <div class="vr"></div>

      <!-- on-surface contexts -->
      <div class="spin-cell">
        <span class="spin-surface"
              style="background:var(--primary);color:var(--primary-foreground)">
          <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
        </span>
        <span class="sz">primary</span>
      </div>
      <div class="spin-cell">
        <span class="spin-surface"
              style="background:var(--muted);border:1px solid var(--border);color:var(--muted-foreground)">
          <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
        </span>
        <span class="sz">muted</span>
      </div>

      <div class="vr"></div>

      <!-- status pill (reconnecting pattern) -->
      <div class="spin-cell" style="align-items:flex-start">
        <span style="display:inline-flex;align-items:center;gap:6px;
                     background:var(--muted);color:var(--muted-foreground);
                     border-radius:var(--radius-full);padding:4px 10px;
                     font-size:12px;border:1px solid var(--border)">
          <svg class="spin" width="12" height="12" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
          Reconnecting…
        </span>
        <span class="sz" style="margin-top:3px;margin-left:4px">status pill</span>
      </div>
    </div>
  </div>

  <!-- ── Button — loading ───────────────────────────── -->
  <div>
    <div class="lbl">Button — loading</div>
    <div class="row">
      <button class="btn btn-p" disabled>
        <svg class="spin" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        Saving…
      </button>
      <button class="btn btn-s" disabled>
        <svg class="spin" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        Processing…
      </button>
      <button class="btn btn-o" disabled>
        <svg class="spin" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        Loading
      </button>
      <button class="btn btn-p btn-sm" disabled>
        <svg class="spin" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        Saving…
      </button>
    </div>
  </div>

  <!-- ── Skeleton ───────────────────────────────────── -->
  <div>
    <div class="lbl">Skeleton — shimmer, 1.6s ease-in-out</div>
    <div class="row-top">

      <!-- stat card skeleton -->
      <div class="sk-card">
        <div class="sk sk-sm" style="width:52%"></div>
        <div class="sk sk-lg" style="width:40%;margin-top:4px"></div>
        <div class="sk sk-sm" style="width:28%"></div>
      </div>

      <!-- table / list skeleton -->
      <div class="sk-table">
        <div class="sk-thead">
          <div class="sk sk-sm" style="width:58px"></div>
          <div class="sk sk-sm" style="width:38px"></div>
        </div>
        <div class="sk-trow">
          <div class="sk sk-cr" style="width:28px;height:28px"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:5px">
            <div class="sk sk-ln" style="width:66%"></div>
            <div class="sk sk-sm" style="width:42%"></div>
          </div>
          <div class="sk sk-sm" style="width:34px"></div>
        </div>
        <div class="sk-trow">
          <div class="sk sk-cr" style="width:28px;height:28px"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:5px">
            <div class="sk sk-ln" style="width:50%"></div>
            <div class="sk sk-sm" style="width:34%"></div>
          </div>
          <div class="sk sk-sm" style="width:34px"></div>
        </div>
        <div class="sk-trow">
          <div class="sk sk-cr" style="width:28px;height:28px"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:5px">
            <div class="sk sk-ln" style="width:76%"></div>
            <div class="sk sk-sm" style="width:50%"></div>
          </div>
          <div class="sk sk-sm" style="width:34px"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Full-screen ────────────────────────────────── -->
  <div>
    <div class="lbl">Full-screen</div>
    <div class="row" style="align-items:flex-start">

      <!-- App init: mark + spinner centered on background -->
      <div>
        <div class="fs-mock">
          <div class="fs-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"
                 width="22" height="22" style="opacity:0.42" class="lq-mark">
              <path d="M32 4c-9 0-16 7-16 18 0 8 3 14 6 22 2 6 4 12 4 16 0 0 2 0 6 0s6 0 6 0c0-4 2-10 4-16 3-8 6-14 6-22 0-11-7-18-16-18z"
                    fill="oklch(0.55 0.12 12)"/>
              <path d="M32 4c-9 0-16 7-16 18 0 4 1 8 2 11 4-3 9-5 14-5s10 2 14 5c1-3 2-7 2-11 0-11-7-18-16-18z"
                    fill="oklch(0.76 0.07 12)"/>
            </svg>
            <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="round">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
          </div>
        </div>
        <div class="fs-label">app init</div>
      </div>

      <!-- Blocking overlay: frosted glass over content -->
      <div>
        <div class="fs-mock" style="background:var(--card)">
          <!-- static content underneath (no shimmer — these represent rendered UI) -->
          <div style="position:absolute;inset:0;padding:14px;
                      display:flex;flex-direction:column;gap:7px">
            <div style="height:10px;border-radius:3px;width:48%;
                        background:var(--neutral-200)"></div>
            <div style="height:10px;border-radius:3px;width:70%;
                        background:var(--neutral-200)"></div>
            <div style="height:10px;border-radius:3px;width:56%;
                        background:var(--neutral-200)"></div>
            <div style="height:10px;border-radius:3px;width:36%;
                        background:var(--neutral-200)"></div>
          </div>
          <!-- frosted overlay -->
          <div style="position:absolute;inset:0;
                      background:color-mix(in oklch, var(--background) 82%, transparent);
                      backdrop-filter:blur(3px);
                      display:flex;flex-direction:column;
                      align-items:center;justify-content:center;gap:7px">
            <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="var(--foreground)" stroke-width="1.5" stroke-linecap="round">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            <span style="font-size:11px;color:var(--muted-foreground)">Processing payment</span>
          </div>
        </div>
        <div class="fs-label">blocking overlay</div>
      </div>

      <!-- Section skeleton: card-level, no overlay -->
      <div>
        <div class="fs-mock">
          <div style="position:absolute;inset:0;padding:14px;
                      display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:2px">
              <div class="sk sk-cr" style="width:24px;height:24px"></div>
              <div class="sk sk-sm" style="width:44%;flex:1"></div>
            </div>
            <div class="sk sk-ln" style="width:88%"></div>
            <div class="sk sk-ln" style="width:72%"></div>
            <div class="sk sk-ln" style="width:60%"></div>
            <div class="sk sk-sm" style="width:40%"></div>
          </div>
        </div>
        <div class="fs-label">section skeleton</div>
      </div>

    </div>
  </div>

</body>
</html>
