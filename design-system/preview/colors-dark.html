<!doctype html><html class="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-row">
    <div class="swatch"><div class="chip" style="background:var(--background); border-bottom-color:var(--border)"></div><div class="meta"><div class="name">background</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--card); border-bottom-color:var(--border)"></div><div class="meta"><div class="name">card</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--foreground)"></div><div class="meta"><div class="name">foreground</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--muted-foreground)"></div><div class="meta"><div class="name">muted-fg</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--primary)"></div><div class="meta"><div class="name">primary</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--accent)"></div><div class="meta"><div class="name">accent</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--border)"></div><div class="meta"><div class="name">border</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--ring)"></div><div class="meta"><div class="name">ring</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--destructive)"></div><div class="meta"><div class="name">destructive</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--success)"></div><div class="meta"><div class="name">success</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--warning)"></div><div class="meta"><div class="name">warning</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--info)"></div><div class="meta"><div class="name">info</div></div></div>
  </div>
</body></html>
