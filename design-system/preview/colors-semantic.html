<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-row">
    <div class="swatch"><div class="chip" style="background:var(--background); border-bottom-color:var(--border)"></div><div class="meta"><div class="name">background</div><div class="val">--background</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--card); border-bottom-color:var(--border)"></div><div class="meta"><div class="name">card</div><div class="val">--card</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--foreground)"></div><div class="meta"><div class="name">foreground</div><div class="val">--foreground</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--muted-foreground)"></div><div class="meta"><div class="name">muted-fg</div><div class="val">--muted-foreground</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--primary)"></div><div class="meta"><div class="name">primary</div><div class="val">rose-500</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--accent)"></div><div class="meta"><div class="name">accent</div><div class="val">--accent</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--border)"></div><div class="meta"><div class="name">border</div><div class="val">--border</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--ring)"></div><div class="meta"><div class="name">ring</div><div class="val">focus</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--destructive)"></div><div class="meta"><div class="name">destructive</div><div class="val">red-500</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--success)"></div><div class="meta"><div class="name">success</div><div class="val">green-500</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--warning)"></div><div class="meta"><div class="name">warning</div><div class="val">amber-500</div></div></div>
    <div class="swatch"><div class="chip" style="background:var(--info)"></div><div class="meta"><div class="name">info</div><div class="val">blue-500</div></div></div>
  </div>
</body></html>
