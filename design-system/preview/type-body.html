<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .tag{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono)}
  .meta{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono)}
</style></head>
<body>
  <div class="row"><span class="tag">lead / lg</span><span style="font-size:16px;line-height:1.65;color:var(--muted-foreground)">Bookings, clients, and payments — in one quiet place.</span><span class="meta">16 / 400</span></div>
  <div class="row"><span class="tag">body / base</span><span style="font-size:14px;line-height:1.5">Maya is fully booked Friday. Move this to Saturday at 10:00?</span><span class="meta">14 / 400</span></div>
  <div class="row"><span class="tag">body / 500</span><span style="font-size:14px;line-height:1.5;font-weight:500">Charge $84 to Visa •• 4242</span><span class="meta">14 / 500</span></div>
  <div class="row"><span class="tag">small / xs</span><span style="font-size:12px;line-height:1.35;color:var(--muted-foreground)">Updated 3 minutes ago by Priya</span><span class="meta">12 / 400</span></div>
</body></html>
