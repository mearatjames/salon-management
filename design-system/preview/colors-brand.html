<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card-row">
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-50)"></div><div class="meta"><div class="name">50</div></div></div>
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-100)"></div><div class="meta"><div class="name">100</div></div></div>
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-200)"></div><div class="meta"><div class="name">200</div></div></div>
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-300)"></div><div class="meta"><div class="name">300</div></div></div>
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-400)"></div><div class="meta"><div class="name">400</div></div></div>
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-500); box-shadow:inset 0 0 0 2px var(--rose-500)"></div><div class="meta"><div class="name">500</div><div class="val">primary</div></div></div>
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-600)"></div><div class="meta"><div class="name">600</div></div></div>
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-700)"></div><div class="meta"><div class="name">700</div></div></div>
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-800)"></div><div class="meta"><div class="name">800</div></div></div>
    <div class="swatch" style="min-width:64px"><div class="chip" style="background:var(--rose-900)"></div><div class="meta"><div class="name">900</div></div></div>
  </div>
</body></html>
