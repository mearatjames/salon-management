<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row{display:flex;align-items:center;gap:12px;padding:5px 0;font-size:12px}
  .name{font-family:var(--font-mono);width:64px;color:var(--muted-foreground)}
  .px{font-family:var(--font-mono);width:48px;color:var(--foreground)}
  .bar{height:10px;background:var(--rose-500);border-radius:2px}
</style></head>
<body>
  <div class="row"><span class="name">space-1</span><span class="px">4px</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="name">space-2</span><span class="px">8px</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="name">space-3</span><span class="px">12px</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="name">space-4</span><span class="px">16px</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="name">space-5</span><span class="px">20px</span><span class="bar" style="width:20px"></span></div>
  <div class="row"><span class="name">space-6</span><span class="px">24px</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="name">space-8</span><span class="px">32px</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="name">space-10</span><span class="px">40px</span><span class="bar" style="width:40px"></span></div>
  <div class="row"><span class="name">space-12</span><span class="px">48px</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="name">space-16</span><span class="px">64px</span><span class="bar" style="width:64px"></span></div>
</body></html>
