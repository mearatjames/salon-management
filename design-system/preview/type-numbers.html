<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 12px;text-align:left;border-bottom:1px solid var(--border)}
  th{font-weight:500;color:var(--muted-foreground);font-size:11px;text-transform:uppercase;letter-spacing:0.04em}
  td.num{font-variant-numeric:tabular-nums;text-align:right;font-feature-settings:"tnum"}
  code{background:var(--muted);padding:2px 6px;border-radius:4px;font-size:12px}
</style></head>
<body>
  <table>
    <thead><tr><th>Service</th><th style="text-align:right">Price</th><th style="text-align:right">Time</th></tr></thead>
    <tbody>
      <tr><td>Classic manicure</td><td class="num">$45</td><td class="num">30 min</td></tr>
      <tr><td>Gel polish</td><td class="num">$60</td><td class="num">45 min</td></tr>
      <tr><td>Russian manicure</td><td class="num">$85</td><td class="num">60 min</td></tr>
      <tr><td>Pedicure + paraffin</td><td class="num">$110</td><td class="num">75 min</td></tr>
    </tbody>
  </table>
  <div style="margin-top:10px;font-size:12px;color:var(--muted-foreground)">Mono used for tokens like <code>--primary</code>, never for body copy.</div>
</body></html>
