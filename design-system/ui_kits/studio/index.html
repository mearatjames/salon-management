<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lacquer Studio — UI Kit</title>
<link rel="stylesheet" href="studio.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="CalendarScreen.jsx"></script>
<script type="text/babel" src="ClientsScreen.jsx"></script>
<script type="text/babel" src="CheckoutScreen.jsx"></script>
<script type="text/babel">
const { useState } = React;
function App() {
  const [screen, setScreen] = useState("calendar");
  const titles = { calendar: "Schedule", clients: "Clients", services: "Services", checkout: "Checkout", inventory: "Inventory", reports: "Reports", settings: "Settings" };
  const Screen = { calendar: CalendarScreen, clients: ClientsScreen, checkout: CheckoutScreen }[screen];
  return (
    <div className="app">
      <Sidebar active={screen} onNavigate={setScreen} />
      <div className="app-main">
        <TopBar title={titles[screen]} />
        <main className="app-content">
          {Screen ? <Screen /> : (
            <div style={{ maxWidth: 480, margin: "80px auto", textAlign: "center", color: "var(--muted-foreground)" }}>
              <div style={{ fontSize: 18, fontWeight: 600, color: "var(--foreground)", marginBottom: 8 }}>{titles[screen]}</div>
              <div style={{ fontSize: 13 }}>Not built in this kit. The Schedule, Clients, and Checkout screens demonstrate the system.</div>
            </div>
          )}
        </main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
