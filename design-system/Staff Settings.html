<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Staff · Lacquer Studio</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="staff-components.jsx"></script>
  <style>
    /* ── Avatar color tokens (not in colors_and_type.css, defined here) ───── */
    :root {
      --avatar-rose:   oklch(0.55 0.12 12);
      --avatar-blue:   oklch(0.60 0.13 240);
      --avatar-green:  oklch(0.62 0.13 150);
      --avatar-amber:  oklch(0.76 0.14 75);
      --avatar-purple: oklch(0.55 0.13 270);
      --avatar-teal:   oklch(0.56 0.13 200);
      --avatar-orange: oklch(0.62 0.17 50);
      --avatar-slate:  oklch(0.44 0.01 90);
    }

    /* ── Reset ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%; width: 100%;
      font-family: var(--font-sans);
      background: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Shell ──────────────────────────────────────────────────────────────── */
    .staff-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--background);
    }

    /* ── Tab bar ────────────────────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      align-items: stretch;
      padding: 0 32px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      height: 44px;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--muted-foreground);
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-sans);
      transition: color var(--duration-fast) var(--ease-out),
                  border-color var(--duration-fast) var(--ease-out);
    }
    .tab-item--active {
      color: var(--foreground);
      font-weight: 600;
      border-bottom-color: var(--primary);
    }
    .tab-item:hover:not(.tab-item--active) { color: var(--foreground); }

    /* ── Page content ───────────────────────────────────────────────────────── */
    .page-content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Staff grid (desktop: 2-col) ────────────────────────────────────────── */
    .staff-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 356px;
      gap: 24px;
      padding: 28px 32px;
      height: 100%;
      overflow: hidden;
    }

    /* ── Roster column ──────────────────────────────────────────────────────── */
    .roster-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    /* ── Panel column ───────────────────────────────────────────────────────── */
    .panel-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }

    /* ── Page header ────────────────────────────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    /* ── Add staff button ───────────────────────────────────────────────────── */
    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 14px;
      height: 34px;
      background: var(--primary);
      color: var(--primary-foreground);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity var(--duration-fast) var(--ease-out);
    }
    .btn-add:hover { opacity: 0.88; }

    /* ── Search ─────────────────────────────────────────────────────────────── */
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--card);
      border: 1px solid var(--input);
      border-radius: var(--radius-md);
      color: var(--muted-foreground);
      cursor: text;
      transition: border-color var(--duration-fast) var(--ease-out);
    }
    .search-wrap:focus-within {
      border-color: var(--ring);
      color: var(--foreground);
    }
    .search-input {
      flex: 1; min-width: 0;
      border: none; outline: none; background: transparent;
      font-size: var(--text-sm); font-family: var(--font-sans);
      color: var(--foreground);
    }
    .search-input::placeholder { color: var(--muted-foreground); }

    /* ── Filter chips ───────────────────────────────────────────────────────── */
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all var(--duration-fast) var(--ease-out);
    }
    .filter-chip--active {
      background: var(--foreground);
      color: var(--background);
      border-color: var(--foreground);
    }
    .filter-chip:not(.filter-chip--active):hover {
      background: var(--accent);
      color: var(--foreground);
      border-color: var(--ring);
    }
    .chip-count {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      opacity: 0.7;
    }
    .filter-chip--active .chip-count { opacity: 0.75; }

    /* ── Staff list ─────────────────────────────────────────────────────────── */
    .staff-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs);
    }

    /* ── Staff row ──────────────────────────────────────────────────────────── */
    .staff-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      background: var(--card);
      outline: none;
      transition: background var(--duration-fast) var(--ease-out);
      text-wrap: nowrap;
    }
    .staff-row:last-child { border-bottom: none; }
    .staff-row:hover:not([data-selected="true"]) { background: var(--accent); }
    .staff-row:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
    .staff-row[data-selected="true"] {
      background: oklch(from var(--primary) l c h / 0.06);
    }
    .staff-row[data-active="false"] { opacity: 0.62; }

    .row-sel-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--primary);
      border-radius: 0 2px 2px 0;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot--on  { background: var(--success); }
    .status-dot--off { background: var(--muted-foreground); }

    .row-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .row-name {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.3;
    }
    .row-sub {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pin-warn {
      display: none; /* mobile only, shown by media query below */
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--warning);
    }

    /* Desktop trailing metadata */
    .row-trailing {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .pin-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }
    .pin-chip--set   { background: oklch(from var(--success) l c h / 0.13); color: var(--success); }
    .pin-chip--unset { background: oklch(from var(--warning) l c h / 0.13); color: var(--warning); }

    .row-date {
      font-size: 11px;
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }

    /* Mobile chevron — hidden on desktop */
    .row-chevron {
      display: none;
      color: var(--muted-foreground);
      flex-shrink: 0;
    }

    /* ── Edit panel ─────────────────────────────────────────────────────────── */
    .edit-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-profile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .panel-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }

    .section-eyebrow {
      padding: 8px 14px 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-foreground);
      border-bottom: 1px solid var(--border);
      background: var(--muted);
    }

    .section-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
    .field-input {
      padding: 8px 12px;
      background: var(--background);
      color: var(--foreground);
      border: 1px solid var(--input);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      outline: none;
      width: 100%;
      transition: border-color var(--duration-fast) var(--ease-out);
    }
    .field-input:focus { border-color: var(--ring); }

    .access-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .access-row--last { border-bottom: none; }

    /* Small ghost button (PIN change) */
    .btn-sm {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      color: var(--foreground);
      cursor: pointer;
      font-family: var(--font-sans);
      white-space: nowrap;
      flex-shrink: 0;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .btn-sm:hover { background: var(--accent); border-color: var(--ring); }

    /* Primary button */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 16px;
      background: var(--primary);
      color: var(--primary-foreground);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: opacity var(--duration-fast) var(--ease-out);
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.38; cursor: not-allowed; }

    /* ── Danger zone ────────────────────────────────────────────────────────── */
    .danger-zone {
      background: oklch(from var(--destructive) l c h / 0.04);
      border: 1px solid oklch(from var(--destructive) l c h / 0.16);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .danger-eyebrow {
      padding: 8px 14px 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--destructive);
      opacity: 0.75;
      border-bottom: 1px solid oklch(from var(--destructive) l c h / 0.10);
      background: oklch(from var(--destructive) l c h / 0.03);
    }
    .danger-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 11px 14px;
      background: transparent;
      border: none;
      border-bottom: 1px solid oklch(from var(--destructive) l c h / 0.08);
      color: var(--destructive);
      font-size: var(--text-sm);
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      text-align: left;
      transition: background var(--duration-fast) var(--ease-out);
    }
    .danger-btn:hover { background: oklch(from var(--destructive) l c h / 0.08); }
    .danger-btn--safe { color: var(--foreground); border-bottom-color: var(--border); }
    .danger-btn--safe:hover { background: var(--accent); }

    /* ── Empty panel ────────────────────────────────────────────────────────── */
    .empty-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 48px 24px;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      min-height: 240px;
    }

    /* ── Shared sheet chrome ────────────────────────────────────────────────── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgb(0 0 0 / 0.45);
      z-index: 40;
      animation: fade-in var(--duration-base) var(--ease-out);
    }
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .btn-icon-sm {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: background var(--duration-fast), color var(--duration-fast);
    }
    .btn-icon-sm:hover { background: var(--accent); color: var(--foreground); }

    /* ── Mobile bottom sheet ────────────────────────────────────────────────── */
    .mobile-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 92vh;
      background: var(--background);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      box-shadow: var(--shadow-lg);
      z-index: 50;
      display: flex;
      flex-direction: column;
      animation: slide-up var(--duration-slow) var(--ease-out);
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: var(--radius-full);
      margin: 10px auto 0;
      flex-shrink: 0;
    }
    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Add staff right sheet ──────────────────────────────────────────────── */
    .add-sheet {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 420px;
      max-width: 100vw;
      background: var(--card);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      z-index: 50;
      display: flex;
      flex-direction: column;
      animation: slide-in-right var(--duration-slow) var(--ease-out);
    }
    .wizard-steps {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--muted);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .wizard-steps::-webkit-scrollbar { display: none; }
    .step-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-dot--active   { background: var(--primary); color: var(--primary-foreground); }
    .step-dot--upcoming { background: var(--border); color: var(--muted-foreground); }

    .add-sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .preview-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .add-sheet-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--muted-foreground);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all var(--duration-fast) var(--ease-out);
    }
    .btn-ghost:hover { background: var(--accent); color: var(--foreground); border-color: var(--ring); }
    .btn-primary-sm {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--primary-foreground);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: opacity var(--duration-fast) var(--ease-out);
    }
    .btn-primary-sm:hover:not(:disabled) { opacity: 0.88; }
    .btn-primary-sm:disabled { opacity: 0.38; cursor: not-allowed; }

    /* ── FAB ────────────────────────────────────────────────────────────────── */
    .fab {
      position: fixed;
      bottom: 24px; right: 20px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      height: 48px;
      background: var(--primary);
      color: var(--primary-foreground);
      border: none;
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      box-shadow: var(--shadow-md);
      z-index: 30;
      transition: opacity var(--duration-fast) var(--ease-out);
    }
    .fab:hover { opacity: 0.88; }

    /* ── Keyframe animations ────────────────────────────────────────────────── */
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slide-up {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes slide-in-right {
      from { transform: translateX(100%); }
      to   { transform: translateX(0); }
    }

    /* ── Responsive: mobile (≤899px) ────────────────────────────────────────── */
    @media (max-width: 899px) {
      .tab-bar   { padding: 0 16px; }
      .staff-grid {
        grid-template-columns: 1fr;
        padding: 16px;
        height: auto;
        overflow: visible;
        gap: 14px;
      }
      .page-content { overflow-y: auto; }
      .panel-col    { display: none; }
      .staff-list   { flex: none; overflow-y: visible; min-height: auto; }
      .row-trailing { display: none; }
      .row-chevron  { display: flex; }
      .pin-warn     { display: inline-flex; }
      .fab          { display: inline-flex; }
    }

    @media (max-width: 599px) {
      .tab-bar    { padding: 0 12px; }
      .staff-grid { padding: 12px; }
      .tab-item   { padding: 0 10px; font-size: 13px; }
    }

    /* ── Responsive: desktop (≥900px) ──────────────────────────────────────── */
    @media (min-width: 900px) {
      .row-chevron  { display: none !important; }
      .pin-warn     { display: none !important; }
      .row-trailing { display: flex; }
      .panel-col    { display: flex; }
    }

    /* ── Tweaks viewport overrides ──────────────────────────────────────────── */
    /* Force mobile */
    [data-vp="mobile"] .staff-grid     { grid-template-columns: 1fr !important; padding: 12px !important; height: auto !important; overflow: visible !important; }
    [data-vp="mobile"] .page-content   { overflow-y: auto !important; }
    [data-vp="mobile"] .panel-col      { display: none !important; }
    [data-vp="mobile"] .staff-list     { flex: none !important; overflow-y: visible !important; }
    [data-vp="mobile"] .row-trailing   { display: none !important; }
    [data-vp="mobile"] .row-chevron    { display: flex !important; }
    [data-vp="mobile"] .pin-warn       { display: inline-flex !important; }
    [data-vp="mobile"] .fab            { display: inline-flex !important; }
    [data-vp="mobile"] .tab-bar        { padding: 0 12px !important; }

    /* Force desktop */
    [data-vp="desktop"] .staff-grid    { grid-template-columns: minmax(0, 1fr) 356px !important; padding: 28px 32px !important; height: 100% !important; overflow: hidden !important; }
    [data-vp="desktop"] .page-content  { overflow: hidden !important; }
