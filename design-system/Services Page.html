<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Services page · Card fee + supply deductions</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-sans); color: var(--foreground); background: var(--background); -webkit-font-smoothing: antialiased; }
  body { overflow: hidden; }
  #root { height: 100%; }
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  /* Custom focus-rings are inside components; suppress the default jagged one inside artboards */
  button, input, select { font-family: inherit; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--ring); outline-offset: 1px;
  }
  /* Hide native search clear button for a cleaner look */
  input[type="search"]::-webkit-search-decoration,
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

  /* Avatar / service-color palette. The existing app uses `--avatar-*` tokens
     to tag staff and services with a circular color. The design system file
     ships rose/blue/green/amber/red as `*-500` only — purple, teal, orange,
     slate are filled in here with OKLCH values tuned to sit harmoniously
     alongside the existing scale (similar chroma, similar lightness). */
  :root {
    --avatar-rose:   var(--rose-500);
    --avatar-blue:   var(--blue-500);
    --avatar-green:  var(--green-500);
    --avatar-amber:  var(--amber-500);
    --avatar-purple: oklch(0.62 0.16 295);
    --avatar-teal:   oklch(0.62 0.12 195);
    --avatar-orange: oklch(0.68 0.16  45);
    --avatar-slate:  oklch(0.55 0.03 250);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Shared building blocks -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="services-data.jsx"></script>
<script type="text/babel" src="StudioShell.jsx"></script>

<!-- Sheets / dialogs -->
<script type="text/babel" src="EditPolicySheet.jsx"></script>

<!-- Variations -->
<script type="text/babel" src="ServicesV1.jsx"></script>
<script type="text/babel" src="ServicesV2.jsx"></script>

<!-- App -->
<script type="text/babel">
const { useState } = React;

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "comfortable"
}/*EDITMODE-END*/;

function App() {
  const t = useTweaks(TWEAKS_DEFAULTS);
  const setTweak = t.setTweak;
  const tweaks = t;

  return (
    <>
      <DesignCanvas>
        <DCSection
          id="services-deductions"
          title="Services page · with card fee + supply deductions"
          subtitle="Two-pane catalog · per-service deduction config · live net-to-tech preview"
        >
          <DCArtboard id="v1-refined" label="V1 · Refined two-pane" width={1440} height={880}>
            <StudioShell>
              <ServicesV1 density={tweaks.density} />
            </StudioShell>
          </DCArtboard>

          <DCArtboard id="v2-payout-first" label="V2 · Payout-first table" width={1440} height={880}>
            <StudioShell>
              <ServicesV2 density={tweaks.density} />
            </StudioShell>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="notes"
          title="Notes"
          subtitle="What each direction commits to"
        >
          <DCArtboard id="rationale" label="Design rationale" width={1440} height={520}>
            <RationaleCard />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Display">
          <TweakRadio
            label="Row density"
            value={tweaks.density}
            onChange={v => setTweak('density', v)}
            options={[
              { value: 'comfortable', label: 'Comfortable' },
              { value: 'compact',     label: 'Compact' },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

function RationaleCard() {
  const Item = ({ title, children, accent }) => (
    <div style={{
      flex: 1, minWidth: 0,
      padding: 22,
      background: 'var(--card)',
      border: '1px solid var(--border)',
      borderRadius: 12,
      display: 'flex', flexDirection: 'column', gap: 10,
    }}>
      <div style={{
        display: 'inline-flex', alignItems: 'center', gap: 8,
        padding: '3px 9px',
        background: 'color-mix(in oklch, var(--primary) 12%, transparent)',
        color: 'var(--rose-700)',
        borderRadius: 999, fontSize: 10.5, letterSpacing: '0.05em', textTransform: 'uppercase',
        fontWeight: 600, alignSelf: 'flex-start',
      }}>{accent}</div>
      <h3 style={{ fontSize: 17, fontWeight: 600, letterSpacing: '-0.01em', margin: 0 }}>{title}</h3>
      <div style={{ fontSize: 13, color: 'var(--muted-foreground)', lineHeight: 1.55 }}>{children}</div>
    </div>
  );

  return (
    <div style={{
      width: '100%', height: '100%', padding: 28,
      background: 'var(--background)',
      display: 'flex', flexDirection: 'column', gap: 18, overflow: 'auto',
    }}>
      <header>
        <h2 style={{ fontSize: 22, fontWeight: 600, letterSpacing: '-0.01em', margin: 0 }}>Why two directions</h2>
        <p style={{ fontSize: 13, color: 'var(--muted-foreground)', marginTop: 6, maxWidth: 720 }}>
          Both variations implement the same data model — hybrid card-fee (default · custom · exempt) and per-service supply deduction with a label. They differ in <em>where the deduction math lives in the visual hierarchy</em>. Per-tech exemptions live on the Staff Settings page.
        </p>
      </header>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18 }}>
        <Item title="V1 · Refined two-pane" accent="Conservative">
          <p style={{ marginTop: 0 }}><strong style={{ color: 'var(--foreground)' }}>Hierarchy:</strong> Service is the spine. Deductions are a strong but bounded section in the edit panel.</p>
          <p><strong style={{ color: 'var(--foreground)' }}>List rows</strong> stay close to the current visual — color swatch, name, deduction chips, duration, price. Chips surface the rule that's in effect (default $3 · custom · supply −$5 with label).</p>
          <p><strong style={{ color: 'var(--foreground)' }}>Policy strip</strong> at the top of the page shows the global card-fee default and supply-deduction count in one row, with a sub‑level "Edit policy" affordance.</p>
          <p><strong style={{ color: 'var(--foreground)' }}>Trade-off:</strong> Owner has to open a service to see the math. But the list reads cleanly even with deductions on every row.</p>
        </Item>
        <Item title="V2 · Payout-first table" accent="Margin-aware">
          <p style={{ marginTop: 0 }}><strong style={{ color: 'var(--foreground)' }}>Hierarchy:</strong> The deduction math is the spine. The list is a true table with a "Tech keeps" column the owner can scan.</p>
          <p><strong style={{ color: 'var(--foreground)' }}>List rows</strong> trade visual softness for information density: Service · Duration · Price · Card fee · Supply · Net. Margin % under each net amount gives a quick scan signal.</p>
          <p><strong style={{ color: 'var(--foreground)' }}>Edit panel</strong> leads with a horizontal payout flow: Price → −Card fee → Tech keeps, with supply applied to the net node. Adjusting controls updates the diagram live.</p>
          <p><strong style={{ color: 'var(--foreground)' }}>Trade-off:</strong> More numbers on screen at once. Right for owner/manager surfaces; would be too dense for a technician.</p>
        </Item>
      </div>

      <div style={{
        padding: '16px 20px',
        background: 'color-mix(in oklch, var(--muted) 40%, var(--background))',
        border: '1px solid var(--border)',
        borderRadius: 10,
        fontSize: 12.5, color: 'var(--muted-foreground)', lineHeight: 1.6,
      }}>
        <strong style={{ color: 'var(--foreground)', fontWeight: 600 }}>Open questions:</strong>
        &nbsp;Should the card-fee policy live on this page or in Settings? Should "supply deduction" support a quantity-based variant (e.g. −$5 × nails painted)? Should the pedi-tier deduction from the Day Report prototype become a third configurable kind?
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
