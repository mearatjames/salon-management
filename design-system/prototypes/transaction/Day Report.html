<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lacquer — Day Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="transaction.css" />
<style>
/* ── Page shell ──────────────────────────────────────────────────── */
html, body, #root { height: 100%; margin: 0; }
body { background: #f0eee9; }
.tablet-bezel  { background: #1a1a1a; border-radius: 22px; padding: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.18); }
.tablet-screen { border-radius: 10px; overflow: hidden; background: var(--background); height: 100%; }

/* ── Day Report App ──────────────────────────────────────────────── */
.dr-app {
  height: 100%; display: flex; flex-direction: column;
  overflow: hidden; background: var(--background);
  font-family: var(--font-sans); font-size: 14px; color: var(--foreground);
  -webkit-font-smoothing: antialiased;
}

/* Header */
.dr-header {
  height: 48px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; border-bottom: 1px solid var(--border);
  background: var(--card); flex-shrink: 0; gap: 10px;
}
.dr-header-l { display: flex; align-items: center; gap: 10px; }
.dr-header-r { display: flex; align-items: center; gap: 6px; }
.dr-title { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; flex-shrink: 0; }

.dr-date-nav {
  display: flex; align-items: center; gap: 1px;
  background: var(--muted); border-radius: 8px; padding: 2px;
}
.dr-nav-btn {
  width: 26px; height: 26px; border-radius: 6px; border: none;
  background: transparent; cursor: pointer; color: var(--foreground);
  display: flex; align-items: center; justify-content: center;
  transition: background 100ms;
}
.dr-nav-btn:hover { background: var(--border); }
.dr-date-lbl { font-size: 12px; font-weight: 600; padding: 0 6px; white-space: nowrap; }

.dr-periods {
  display: flex; background: var(--muted); border-radius: 7px; padding: 2px; gap: 1px;
}
.dr-period-btn {
  padding: 3px 9px; border-radius: 5px; border: none; background: transparent;
  font-size: 11px; font-weight: 500; cursor: pointer; color: var(--muted-foreground);
  font-family: var(--font-sans); transition: all 120ms;
}
.dr-period-btn.on { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-xs); }

.dr-ghost-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--card);
  font-size: 12px; font-weight: 500; cursor: pointer; color: var(--foreground);
  font-family: var(--font-sans); transition: background 120ms;
}
.dr-ghost-btn:hover { background: var(--muted); }

/* Summary strip */
.dr-summary {
  display: grid; grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--border); background: var(--card); flex-shrink: 0;
}
.dr-stat { padding: 9px 16px; border-right: 1px solid var(--border); }
.dr-stat.last { border-right: none; }
.dr-stat-l {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--muted-foreground); margin-bottom: 2px;
}
.dr-stat-v {
  font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; line-height: 1.15;
}
.dr-stat-v.neg { color: var(--destructive); }
.dr-stat-v.pos { color: var(--success); }
.dr-stat-v.tip { color: oklch(0.42 0.12 150); }
.dr-stat-s { font-size: 10px; color: var(--muted-foreground); margin-top: 1px; }

/* Body */
.dr-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }

/* ── Variant B: contextual summary strip ─────────────────────── */
.dr-summary-b {
  display: flex; align-items: stretch;
  background: var(--card); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.dr-scope {
  padding: 11px 16px; flex-shrink: 0; min-width: 180px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: center;
}
.dr-scope-ttl {
  font-size: 14px; font-weight: 700; letter-spacing: -0.02em;
  display: flex; align-items: center; flex-wrap: wrap;
}
.dr-scope-sub {
  font-size: 11px; color: var(--muted-foreground); margin-top: 2px;
}
.dr-scope-stats {
  flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
}
.dr-scope-stat {
  padding: 10px 16px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: center;
}
.dr-scope-stat:last-child { border-right: none; }
.dr-scope-stat-l {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--muted-foreground);
}
.dr-scope-stat-v {
  font-size: 19px; font-weight: 700; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 2px;
}
.dr-scope-stat-v.neg { color: var(--destructive); }
.dr-scope-stat-v.pos { color: var(--success); }
.dr-scope-stat-v.tip { color: oklch(0.42 0.12 150); }

/* Variant A: narrower left nav (no per-tech KPIs except inline Net) */
.dr-left.nav { width: 232px; }
.dr-tech-card.nav { padding: 8px 10px; }

/* Variant B: slimmer right detail header (totals are in top strip) */
.dr-detail-head.slim { padding: 8px 16px; }


/* Left panel */
.dr-left {
  width: 282px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}

.dr-allstaff-btn {
  flex-shrink: 0; padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  background: transparent; text-align: left;
  border-top: none; border-right: none;
  border-left: 3px solid transparent;
  cursor: pointer; width: 100%; transition: background 120ms;
}
.dr-allstaff-btn:hover { background: var(--muted); }
.dr-allstaff-btn.on {
  background: color-mix(in oklch, var(--primary) 7%, var(--card));
  border-left-color: var(--primary); padding-left: 11px;
}

.dr-tech-list {
  flex: 1; overflow-y: auto; padding: 5px;
  display: flex; flex-direction: column; gap: 3px;
}
.dr-tech-list::-webkit-scrollbar { width: 4px; }
.dr-tech-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.dr-tech-card {
  padding: 9px 10px; border-radius: 8px;
  border: 1px solid transparent; background: transparent;
  text-align: left; cursor: pointer; width: 100%;
  transition: all 120ms;
}
.dr-tech-card:hover { background: var(--muted); }
.dr-tech-card.on {
  background: color-mix(in oklch, var(--primary) 7%, var(--card));
  border-color: color-mix(in oklch, var(--primary) 35%, transparent);
}

.dr-card-nums { display: flex; gap: 12px; margin-top: 7px; }
.dr-card-num  { display: flex; flex-direction: column; gap: 1px; }
.dr-cn-l {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted-foreground);
}
.dr-cn-v { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dr-cn-v.neg  { color: var(--destructive); }
.dr-cn-v.bold { font-weight: 700; }

/* Exempt badges */
.dr-exempt-tag {
  font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
  background: color-mix(in oklch, var(--success) 14%, transparent);
  color: oklch(0.36 0.12 150);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.dr-exempt-badge {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 9999px;
  background: color-mix(in oklch, var(--success) 14%, transparent);
  color: oklch(0.36 0.12 150);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.dr-exempt-inline {
  display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
  background: color-mix(in oklch, var(--success) 14%, transparent);
  color: oklch(0.36 0.12 150); text-transform: uppercase; letter-spacing: 0.04em;
}
.dr-em-dash { color: oklch(0.38 0.10 150); font-weight: 600; }

/* Right panel */
.dr-right { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

.dr-detail { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

.dr-detail-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--card); flex-shrink: 0; gap: 10px; flex-wrap: wrap;
}

.dr-head-totals { display: flex; gap: 18px; flex-shrink: 0; text-align: right; }
.dr-htotal { min-width: 58px; }
.dr-htotal-l {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--muted-foreground);
}
.dr-htotal-v {
  font-size: 17px; font-weight: 700; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; margin-top: 1px;
}
.dr-htotal-v.neg { color: var(--destructive); }
.dr-htotal-v.pos { color: var(--success); }
.dr-htotal-v.tip { color: oklch(0.42 0.12 150); }

/* Table */
.dr-table-wrap { flex: 1; overflow-y: auto; }
.dr-table-wrap::-webkit-scrollbar { width: 5px; }
.dr-table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.dr-table { width: 100%; border-collapse: collapse; font-size: 12px; }

.dr-table th {
  position: sticky; top: 0; z-index: 2;
  background: var(--muted);
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted-foreground);
  padding: 6px 10px; text-align: left;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
.dr-table th.num  { text-align: right; }
.dr-table th.ded  { color: var(--destructive); }

.dr-table td {
  padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle;
}
.dr-table td.num  { text-align: right; font-variant-numeric: tabular-nums; }
.dr-table td.dc   { color: var(--neutral-400); font-size: 11px; }
.dr-table td.dc.on{ color: var(--destructive); font-weight: 600; font-size: 12px; }
.dr-table td.net-cell { font-weight: 700; }
.dr-table td.tip-cell { color: oklch(0.40 0.12 150); font-weight: 600; }

/* Transaction rows */
.dr-tx-row { transition: background 80ms; }
.dr-tx-row.click { cursor: pointer; }
.dr-tx-row.click:hover { background: var(--muted); }
.dr-tx-row.exp  { background: color-mix(in oklch, var(--primary) 4%, var(--background)); }

.dr-time   { font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
.dr-client { font-weight: 600; white-space: nowrap; font-size: 12px; }
.dr-svcs   { color: var(--muted-foreground); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.dr-expand-caret {
  display: inline-flex; align-items: center; margin-right: 4px;
  color: var(--muted-foreground); transition: transform 150ms;
  vertical-align: middle;
}
.dr-expand-caret.open { transform: rotate(180deg); }

/* Expanded detail row */
.dr-expand-row td {
  padding: 2px 12px 8px;
  background: color-mix(in oklch, var(--primary) 3%, var(--background));
}
.dr-expand-inner {
  display: flex; gap: 20px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px;
}
.dr-expand-sec  { flex: 1; min-width: 0; }
.dr-expand-ttl  {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted-foreground); margin-bottom: 5px;
}
.dr-expand-line {
  display: flex; justify-content: space-between; gap: 8px;
  font-size: 11px; padding: 2px 0; border-bottom: 1px solid var(--border);
}
.dr-expand-line:last-of-type { border-bottom: none; }
.dr-expand-type { color: var(--muted-foreground); font-weight: 600; }
.dr-expand-name { color: var(--foreground); }
.dr-expand-ded  { color: var(--destructive); font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.dr-expand-subtotal {
  display: flex; justify-content: space-between;
  font-size: 11px; font-weight: 700; padding: 4px 0 0; margin-top: 2px;
  border-top: 1px solid var(--border);
}

/* Footer totals row */
.dr-foot-row td {
  font-weight: 700; font-size: 12px;
  background: var(--muted);
  border-top: 2px solid var(--border);
  padding: 8px 10px;
}

/* Staff overview rows */
.dr-staff-row { transition: background 80ms; cursor: default; }
.dr-staff-row:hover { background: color-mix(in oklch, var(--primary) 3%, var(--background)); }

/* Legend bar */
.dr-legend {
  flex-shrink: 0;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  padding: 6px 14px; background: var(--muted);
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--muted-foreground);
}
.dr-legend strong { color: var(--foreground); }
.dr-legend-sep { color: var(--border); font-size: 14px; }

/* ── Print ───────────────────────────────────────────────────────── */
@media print {
  html, body, #root { height: auto; }
  body { background: white; }
  .tablet-bezel, .tablet-screen { border-radius: 0; padding: 0; box-shadow: none; }
  .dr-app { height: auto; overflow: visible; }
  .dr-body { overflow: visible; }
  .dr-left { display: none; }
  .dr-right { width: 100%; }
  .dr-detail { height: auto; overflow: visible; }
  .dr-table-wrap { overflow: visible; }
  .dr-table th { position: static; background: #f5f5f3; }
  .dr-header-r { display: none; }
  .dc-chrome, .dc-post-it, .tweaks-panel { display: none !important; }
}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="DayReport.jsx"></script>

<script type="text/babel">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mayaExempt": true,
  "linhExempt": true
}/*EDITMODE-END*/;

function TabletArtboard({ children }) {
  return (
    <div className="tablet-bezel" style={{ width: 1024, height: 720 }}>
      <div className="tablet-screen">{children}</div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const exemptSet = new Set([
    ...(t.mayaExempt ? ['maya'] : []),
    ...(t.linhExempt ? ['linh'] : []),
  ]);

  return (
    <>
      <DesignCanvas
        title="Lacquer · Day Report"
        subtitle="Manager view — daily earnings per nail tech with automatic deduction breakdown">
        <DCSection id="day-report" title="Day Report" subtitle="Tablet (1024×720) — tap a tech on the left to drill into their transaction detail; click any row to expand deductions">
          <DCArtboard id="day-report-tablet" label="Original — 3 KPI tiles + full left cards" width={1056} height={752}>
            <TabletArtboard>
              <DayReport exemptTechs={exemptSet} variant="original" />
            </TabletArtboard>
          </DCArtboard>

          <DCArtboard id="day-report-a" label="A — Detail-first (drop top tiles, slim left to nav)" width={1056} height={752}>
            <TabletArtboard>
              <DayReport exemptTechs={exemptSet} variant="a" />
            </TabletArtboard>
          </DCArtboard>

          <DCArtboard id="day-report-b" label="B — Summary-first (contextual top strip; slim right header)" width={1056} height={752}>
            <TabletArtboard>
              <DayReport exemptTechs={exemptSet} variant="b" />
            </TabletArtboard>
          </DCArtboard>
        </DCSection>

        <DCPostIt left={40} top={40} width={320}>
          <strong>Resolving the redundancy</strong><br /><br />
          The <strong>original</strong> shows the same 3 numbers in 3 places (top tiles, right header, table footer) and shows each tech's KPIs in both the left cards and the All-Staff table.<br /><br />
          <strong>Option A — Detail-first.</strong> Drop the top KPI tiles. Left becomes pure navigation (avatar + name + one inline Net figure). The <em>right panel</em> is the single source of truth — header totals + table.<br /><br />
          <strong>Option B — Summary-first.</strong> Keep the top strip but make it <em>contextual</em> (updates as you pick a tech, adds Commissionable). Remove the right-side header totals entirely. Left becomes pure nav. The <em>top strip</em> is the single source of truth.<br /><br />
          Both options keep the table footer for at-a-glance totals while scrolling.
        </DCPostIt>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Exempt techs (owners / family)" />
        <TweakToggle label="Maya P. — exempt" value={t.mayaExempt} onChange={v => setTweak('mayaExempt', v)} />
        <TweakToggle label="Linh T. — exempt" value={t.linhExempt} onChange={v => setTweak('linhExempt', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
