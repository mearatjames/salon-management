<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lacquer — User Onboarding</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="onboarding.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root" data-screen-label="01 Settings · Onboarding"></div>

<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="PinModal.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="OnboardSheet.jsx"></script>
<script type="text/babel" src="OffboardSheet.jsx"></script>
<script type="text/babel" src="RemoveSheet.jsx"></script>
<script type="text/babel" src="Onboarding.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "startMode": "thorough",
  "demoSheet": "none"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Re-mount the page when demoSheet changes so the sheet opens fresh
  const pageKey = `${t.startMode}|${t.demoSheet}`;

  return (
    <div className="app">
      <UMSidebar />
      <div className="app-main">
        <UMTopBar />
        <div className="app-content">
          <OnboardingPage key={pageKey} initialTweaks={t} />
        </div>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Demo state" />
        <TweakRadio
          label="Onboard mode"
          value={t.startMode}
          options={['quick', 'thorough']}
          onChange={(v) => setTweak('startMode', v)}
        />
        <TweakSelect
          label="Open a sheet"
          value={t.demoSheet}
          options={[
            { value: 'none',      label: 'None — list view only' },
            { value: 'onboard',   label: 'Onboard wizard (open)' },
            { value: 'offboard',  label: 'Offboard sheet (Maya)' },
            { value: 'remove',    label: 'Remove permanently (Jin)' },
          ]}
          onChange={(v) => setTweak('demoSheet', v)}
        />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
